name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Publishing to Modrinth is skipped until this secret exists.
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches mod.version
        run: |
          version=$(sed -n 's/^mod\.version = "\(.*\)"$/\1/p' stonecutter.properties.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mod.version $version"
            exit 1
          fi

      - name: Build and test every version
        run: ./gradlew build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          jars=$(ls versions/*/build/libs/callouts-*.jar | grep -v -- '-sources.jar$')
          gh release create "$GITHUB_REF_NAME" $prerelease --generate-notes $jars

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export CHANGELOG="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          ./gradlew modrinth
