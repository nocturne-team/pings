name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches mod.version
        run: |
          version=$(sed -n 's/^mod\.version = "\(.*\)"$/\1/p' stonecutter.properties.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mod.version $version"
            exit 1
          fi

      - name: Build and test both loaders
        run: ./gradlew :26.3-fabric:build :26.3-neoforge:build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease --generate-notes \
            versions/26.3-fabric/build/libs/callouts-fabric-*+26.3.jar \
            versions/26.3-neoforge/build/libs/callouts-neoforge-*+26.3.jar
