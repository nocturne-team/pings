name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per Stonecutter project in settings.gradle.kts.
        project: [26.3-fabric, 26.3-neoforge, 26.2-fabric, 26.2-neoforge]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test (${{ matrix.project }})
        run: ./gradlew :${{ matrix.project }}:build
